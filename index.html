<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竖排文字</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #fafafa;
    font-family: -apple-system, "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 600px;
    padding: 16px;
    box-sizing: border-box;
  }
  textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  /* 从右往左的列布局 */
  #output {
    display: flex;
    flex-direction: row-reverse; 
    flex-wrap: wrap;
    justify-content: center; /* 整体居中 */
    align-items: flex-start;
    gap: 20px;
    padding: 10px;
    min-height: 200px;
    border: 1px dashed #ccc;
    border-radius: 8px;
  }
  /* 每一列从上往下 */
  .column {
    display: flex;
    flex-direction: column; 
    align-items: center;
    gap: 8px;
    font-size: 24px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="wrap">
  <textarea id="input" placeholder="输入中文或英文..."></textarea>
  <button onclick="render()">生成竖排</button>
  <div id="output"></div>
</div>

<script>
function render() {
  const text = document.getElementById('input').value.trim();
  const out = document.getElementById('output');
  out.innerHTML = '';

  if (!text) return;

  let items = [];
  
  // 包含中文/日文就按单字拆，否则按空格拆词
  if (/[\u4e00-\u9fa5\u3040-\u30ff]/.test(text)) {
    // 中文/日文：去掉标点和空格，按单字拆分
    items = Array.from(text).filter(ch => /[\u4e00-\u9fa5\u3040-\u30ff\w]/.test(ch));
  } else {
    // 英文等：按空格拆词
    items = text.split(/\s+/).filter(Boolean);
  }

  // 每列放 5 个字/词，可自己修改这个数字
  const perCol = 5; 
  for (let i = 0; i < items.length; i += perCol) {
    const col = document.createElement('div');
    col.className = 'column';
    items.slice(i, i + perCol).forEach(item => {
      const div = document.createElement('div');
      div.textContent = item;
      col.appendChild(div);
    });
    out.appendChild(col);
  }
}
</script>
</body>
</html>
